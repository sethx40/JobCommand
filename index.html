<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18211f" />
    <title>JobCommand</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="styles.css?v=20260609-2009" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <img class="brand-logo" src="icons/jobcommand-logo.png" alt="JobCommand" />
        <div class="title-block">
          <p class="eyebrow" id="companyLabel">JobCommand</p>
          <h1 id="viewTitle">Today</h1>
        </div>
        <button class="icon-button" id="quickAddBtn" type="button" aria-label="Add job">+</button>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item active" data-view="today" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M8 8h8M8 12h5M8 16h7"/></svg>
          <span>Today</span>
        </button>
        <button class="nav-item" data-view="jobs" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5 12 4l8.5 4.5v9A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-9Z"/><path d="M9 20v-6h6v6"/></svg>
          <span>Jobs</span>
        </button>
        <button class="nav-item" data-view="calendar" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5v3M17 3.5v3M4.5 9h15M7 5h10a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 17 20H7a2.5 2.5 0 0 1-2.5-2.5v-10A2.5 2.5 0 0 1 7 5Z"/><path d="M8 13h3M13 13h3M8 16h3"/></svg>
          <span>Calendar</span>
        </button>
        <button class="nav-item" data-view="schedule" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v3M18 4v3M4 9h16M6.5 5.5h11A2.5 2.5 0 0 1 20 8v10.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5V8a2.5 2.5 0 0 1 2.5-2.5Z"/><path d="M8 13h3M8 17h6"/></svg>
          <span>Schedule</span>
        </button>
        <button class="nav-item" data-view="workOrders" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l3 3V20a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5Z"/><path d="M14 3.5V7h3.5M9 12h6M9 16h6"/></svg>
          <span>Orders</span>
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19 12a7.4 7.4 0 0 0-.1-1.1l2-1.5-2-3.4-2.4 1a8.2 8.2 0 0 0-1.9-1.1L14.3 3h-4.6l-.3 2.9A8.2 8.2 0 0 0 7.5 7l-2.4-1-2 3.4 2 1.5A7.4 7.4 0 0 0 5 12c0 .4 0 .8.1 1.1l-2 1.5 2 3.4 2.4-1c.6.5 1.2.8 1.9 1.1l.3 2.9h4.6l.3-2.9c.7-.3 1.3-.6 1.9-1.1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1.1Z"/></svg>
          <span>Settings</span>
        </button>
      </nav>
    </div>

    <dialog id="modal" class="modal">
      <div class="modal-card" id="modalCard">
        <div class="modal-head">
          <h2 id="modalTitle">Add</h2>
          <button class="ghost-button" id="modalCloseBtn" type="button">Close</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </dialog>

    <template id="jobFormTemplate">
      <div class="form-section">
        <h3>Customer</h3>
        <div class="form-grid">
          <label>Customer / Job name<input name="name" required /></label>
          <label>Phone<input name="phone" type="tel" /></label>
          <label>Email<input name="email" type="email" /></label>
          <label>Job address<input name="address" /></label>
        </div>
      </div>
      <div class="form-section">
        <h3>Production</h3>
        <div class="form-grid">
          <label>Job type<input name="type" placeholder="Bathroom remodel, roof, water loss" /></label>
          <label>Payment type
            <select name="paymentType">
              <option></option>
              <option>Insurance</option>
              <option>Self-pay</option>
            </select>
          </label>
          <label>Sales rep<select name="salesRep"></select></label>
          <label>Production manager<select name="productionManager"></select></label>
          <label>Status<select name="status"></select></label>
          <label>Materials status
            <select name="materialsStatus">
              <option>Not needed</option>
              <option>Needed</option>
              <option>Ordered</option>
              <option>Delivered</option>
              <option>Missing</option>
            </select>
          </label>
        </div>
      </div>
      <div class="form-section">
        <h3>Schedule & Notes</h3>
        <div class="form-grid">
          <label>Start date<input name="startDate" type="date" /></label>
          <label>Target completion<input name="targetDate" type="date" /></label>
          <label class="check-row full"><input name="homeownerUpdateNeeded" type="checkbox" /> Homeowner update needed</label>
          <label class="full">Notes<textarea name="notes" rows="4"></textarea></label>
        </div>
      </div>
      <div class="modal-actions split-actions">
        <button class="ghost-button" data-action="close-modal" type="button">Cancel</button>
        <button class="primary-button" type="submit">Save job</button>
      </div>
    </template>

    <script>
      window.JOBCOMMAND_DEBUG_BUILD = "20260609-2009";
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
      }
      if ("caches" in window) {
        caches.keys().then((keys) => keys.forEach((key) => {
          if (key.startsWith("jobcommand-")) caches.delete(key);
        }));
      }
    </script>
    <script src="app.js?v=20260609-2009" type="module"></script>
  </body>
</html>
